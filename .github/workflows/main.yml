name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Compatible Gradle 8.5
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Setup Android Project Files
      run: |
        # 1. إنشاء هيكلية مشروع أندرويد
        mkdir -p app/src/main/java/com/example/hi
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 2. نقل وتنظيم ملفات الجافا والـ XML المرفوعة
        find x/ -name "App.java" -exec cp {} app/src/main/java/com/example/hi/App.java \; 2>/dev/null || true
        find x/ -name "*.java" -exec cp {} app/src/main/java/com/example/hi/ \; 2>/dev/null || true
        find x/ -name "*.xml" -exec cp {} app/src/main/res/layout/activity_main.xml \; 2>/dev/null || true

        # 3. إعداد ملفات Gradle وتفعيل AndroidX
        echo 'android.useAndroidX=true' > gradle.properties
        echo 'android.enableJetifier=true' >> gradle.properties

        echo 'rootProject.name = "HiApp"' > settings.gradle
        echo "include ':app'" >> settings.gradle

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.example.hi'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.hi"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 4. إنشاء ملف AndroidManifest مخصص باسم hi
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="hi"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".App" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hi-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
